# ==========================================
# APPLICATION
# ==========================================

spring.application.name=backend


# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resort_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}


# ==========================================
# JWT
# ==========================================

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ==========================================
# LOGGING
# ==========================================

logging.level.root=INFO
logging.level.com.paradiseresort.backend=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# ==========================================
# CORS
# ==========================================

app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
# ==========================================
# ADMIN INITIALIZER
# ==========================================
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.name=${ADMIN_NAME:Resort Admin}
app.admin.reset-password=${ADMIN_RESET_PASSWORD:false}